<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in securely before entering the Intellia360 Tug of War game.">
  <title>Sign In | Intellia360 Tug of War</title>
  <link rel="icon" type="image/jpeg" href="assets/logo/intellia360-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-page-shell">
    <a href="/" class="auth-brand" aria-label="Back to Intellia360 home">
      <img src="assets/logo/intellia360-logo.jpg" alt="Intellia360" class="auth-brand-logo">
    </a>
    <section class="auth-card" aria-labelledby="auth-title">
      <span class="section-pill-tag">SECURE GAME ACCESS</span>
      <h1 id="auth-title">Enter the arena</h1>
      <p class="auth-card-copy">Create an account or log in. Firebase confirms your account before the game opens.</p>
      <p class="auth-status" data-auth-status role="status">Checking your Firebase session...</p>
      <div class="auth-mode-toggle" role="tablist" aria-label="Authentication mode">
        <button type="button" class="auth-mode-button active" data-auth-mode="login" role="tab" aria-selected="true">Log in</button>
        <button type="button" class="auth-mode-button" data-auth-mode="signup" role="tab" aria-selected="false">Create account</button>
      </div>
      <form class="auth-form" data-email-form novalidate>
        <label class="auth-field-label" for="authEmail">Email address</label>
        <input class="auth-field-input" id="authEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label class="auth-field-label" for="authPassword">Password</label>
        <input class="auth-field-input" id="authPassword" name="password" type="password" autocomplete="current-password" minlength="6" placeholder="At least 6 characters" required>
        <span class="auth-password-hint" data-password-hint></span>
        <button type="submit" class="btn-pill btn-blue auth-login-button" data-email-submit>Log in</button>
      </form>
      <div class="auth-divider"><span>or</span></div>
      <button type="button" class="btn-pill btn-white-border auth-login-button" data-firebase-google>Continue with Google</button>
      <a class="auth-back-link" href="/">Back to landing page</a>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-flow.js"></script>
</body>
</html>
